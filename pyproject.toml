[project]
name = "a27"
version = "0.1.0"
description = "A unified private-capital pipeline: classification, extraction, configurable compliance, ledger"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "anthropic>=0.34",
    "langfuse>=2.30",
    "pytesseract>=0.3.10",
    "pdfplumber>=0.11",
    "python-multipart>=0.0.9",
    "cryptography>=42.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "greenlet>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Fail loudly on hidden network/API dependency in tests.
addopts = "-ra"